server:
  address: 127.0.0.1
  port: 8088
  error:
    include-message: never
spring:
  application:
    name: creator-workbench
  datasource:
    url: jdbc:h2:file:./data/workbench;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
workbench:
  files-dir: ./data/files
  allowed-origins: http://127.0.0.1:5178,http://localhost:5178,http://127.0.0.1:4178,http://localhost:4178,http://127.0.0.1:8088

  # 远程媒体 Worker 的协议网关地址，不是 ComfyUI 原生地址。默认关闭。
  media-executor-url: ${CREATOR_MEDIA_EXECUTOR_URL:}
  media-executor-enabled: ${CREATOR_MEDIA_EXECUTOR_ENABLED:false}
